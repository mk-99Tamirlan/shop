name: shop
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop && psql -U shop -d shop -tAc 'SELECT count(*) FROM products' | grep -qx 200000"]
      interval: 5s
      timeout: 5s
      retries: 60
    mem_limit: 1g
    cpus: 2
  app:
    build: ./app
    environment:
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
      INSTANCE_NAME: app
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 200m
    cpus: 0.5
    restart: on-failure
  k6:
    image: grafana/k6:0.57.0
    profiles: [test]
    environment:
      BASE_URL: http://app:8000
    volumes:
      - ./k6:/scripts:ro
volumes:
  pgdata:
