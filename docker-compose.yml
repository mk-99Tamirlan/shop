name: shop
x-app: &app
  build: ./app
  depends_on:
    postgres:
      condition: service_healthy
  mem_limit: 200m
  cpus: 0.5
  restart: on-failure
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop && psql -U shop -d shop -tAc 'SELECT count(*) FROM products' | grep -qx 200000"]
      interval: 5s
      timeout: 5s
      retries: 60
    mem_limit: 1g
    cpus: 2
  app1:
    <<: *app
    environment:
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
      INSTANCE_NAME: app1
  app2:
    <<: *app
    environment:
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
      INSTANCE_NAME: app2
  app3:
    <<: *app
    environment:
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
      INSTANCE_NAME: app3
  lb:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    restart: on-failure
  k6:
    image: grafana/k6:0.57.0
    profiles: [test]
    environment:
      BASE_URL: http://lb
    volumes:
      - ./k6:/scripts:ro
volumes:
  pgdata:

