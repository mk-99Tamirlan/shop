listen_addresses = '*'
timezone = 'UTC'

# --- Соединения: немного, перед базой стоит PgBouncer
max_connections = 100

# --- Память
shared_buffers = 96MB             # кэш страниц таблиц (~25% ОЗУ)
effective_cache_size = 256MB      # подсказка планировщику: сколько кэширует ОС
work_mem = 4MB                    # на КАЖДУЮ сортировку в запросе (× соединения!)
maintenance_work_mem = 64MB       # для VACUUM и CREATE INDEX

# --- SSD
random_page_cost = 1.1            # по умолчанию 4 — для HDD
effective_io_concurrency = 200

# --- WAL и контрольные точки: реже и плавнее запись на диск
wal_buffers = 4MB
checkpoint_timeout = 10min
max_wal_size = 1GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9

# --- Репликация (раньше было в command)
wal_level = replica
max_wal_senders = 10
wal_keep_size = 512MB
hot_standby = on
hot_standby_feedback = on

# --- Параллельные запросы
max_worker_processes = 8             # keep lab-6 recovery compatibility; parallel workers remain 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4

# --- Автовакуум чаще (по умолчанию 0.2 и 0.1)
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# --- Наблюдаемость
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
log_min_duration_statement = 200  # логировать запросы дольше 200 мс
log_checkpoints = on
log_lock_waits = on
